<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onsen Finder Japan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: header + toolbar, then map and ranked list side by side (stacked on phones); details slide in as a sheet. */
:root{
  --ink:#1d2a33;          /* basalt */
  --muted:#5f6f78;
  --paper:#f3f5f2;        /* steam */
  --panel:#ffffff;
  --line:#d9e0dc;
  --water:#2f7f86;        /* mineral teal */
  --water-soft:#dcecea;
  --yu:#c8442c;           /* ♨ sign vermilion, used for scores */
  --yu-soft:#f6e2dc;
  --land:#e7ebe5;
  --land-line:#c5cec8;
  --sea:#eef3f3;
  --gold:#b8892a;
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ecea; --muted:#9aaab0; --paper:#11181c; --panel:#182227; --line:#2b3a41;
    --water:#5fb7bd; --water-soft:#1d3539; --yu:#ff7a5c; --yu-soft:#3a221d;
    --land:#1f2b30; --land-line:#34464d; --sea:#131c20; --gold:#e0b45a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ecea; --muted:#9aaab0; --paper:#11181c; --panel:#182227; --line:#2b3a41;
  --water:#5fb7bd; --water-soft:#1d3539; --yu:#ff7a5c; --yu-soft:#3a221d;
  --land:#1f2b30; --land-line:#34464d; --sea:#131c20; --gold:#e0b45a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:.02em;white-space:nowrap}
.brand .mark{color:var(--yu);font-size:22px}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.primary{background:var(--water);border-color:var(--water);color:#fff}
.btn .count{background:var(--yu);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
select.btn{padding-right:8px}
.chipsrow{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr)}
#mapwrap{position:relative;min-height:0;background:var(--sea);border-right:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none}
.pref{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.pref.on{fill:var(--water-soft);stroke:var(--water)}
.pt{stroke:var(--panel);cursor:pointer}
.pt.sel{stroke:var(--ink)}
.maplegend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 24px)}
.maplegend .bar{height:8px;border-radius:4px;width:160px;background:linear-gradient(90deg,#8fa7ad,#5f9ea3,#d9a441,#c8442c,#8e1f12)}
.maplegend .ticks{display:flex;justify-content:space-between;width:160px;color:var(--muted);font-variant-numeric:tabular-nums}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
#listwrap{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.summary{padding:10px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.sumctl{display:flex;gap:6px}
.btn.sm{padding:3px 8px;font-size:13px}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
#list{overflow-y:auto;flex:1;padding:8px 12px 24px;display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.card.sel{border-color:var(--water);box-shadow:0 0 0 2px var(--water-soft)}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--yu-soft);color:var(--yu);padding:4px 0}
.score .n{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.score.mid{background:var(--water-soft);color:var(--water)}
.score.low{background:var(--land);color:var(--muted)}
.stars{position:relative;display:inline-block;font-size:11px;letter-spacing:1px;line-height:1}
.stars::before{content:"★★★★★";color:var(--line)}
.stars i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;font-style:normal;color:currentColor}
.stars i::before{content:"★★★★★"}
.card h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
.card .sub{color:var(--muted);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--land);color:var(--ink);white-space:nowrap}
.tag.t{color:#fff}
.badge{font-size:11.5px;border-radius:6px;padding:1px 6px;border:1px solid var(--gold);color:var(--gold);white-space:nowrap}
.badge.k{border-color:var(--water);color:var(--water)}
.more{margin:6px auto 0}
/* detail sheet */
#sheet{position:fixed;z-index:20;background:var(--panel);border-left:1px solid var(--line);top:0;right:0;bottom:0;width:min(440px,100%);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
#sheet.open{transform:none}
#sheet .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
#sheet h2{font-family:var(--font-display);margin:0;font-size:24px;line-height:1.2;text-wrap:balance}
#sheet .alt{color:var(--muted);font-size:14px}
#sheet .bd{overflow-y:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:14px}
.x{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;font-size:18px}
.bigscore{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--yu-soft);border-radius:12px;padding:10px 12px;color:var(--yu)}
.bigscore .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bigscore .stars{font-size:16px}
.bigscore .parts{color:var(--ink);font-size:12.5px;display:grid;grid-template-columns:auto auto;gap:0 10px;justify-content:start}
.bigscore .parts span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.supply{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;font-weight:500}
.supply.K{background:var(--water-soft);color:var(--water)}
.supply.M{background:var(--land)}
.supply.C{background:var(--yu-soft);color:var(--yu)}
.note{font-size:12.5px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--water);font-size:14px}
.baths{margin:0;padding-left:18px;font-size:14px}
/* filter panel */
#filters{position:fixed;inset:0;z-index:30;display:none}
#filters.open{display:block}
#filters .scrim{position:absolute;inset:0;background:rgba(10,20,25,.45)}
#filters .pane{position:absolute;left:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);display:flex;flex-direction:column}
#filters .pane .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#filters .pane .hd h2{margin:0;font-size:18px}
#filters .pane .bd{overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:18px}
.fgroup h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.fgroup .opts{display:flex;flex-wrap:wrap;gap:6px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1}
.range output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--yu);min-width:3ch}
#filters .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
/* about */
#about{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,20,25,.45);padding:16px;overflow:auto}
#about.open{display:block}
#about .box{max-width:680px;margin:24px auto;background:var(--panel);border-radius:14px;padding:18px 20px;border:1px solid var(--line)}
#about h2{font-family:var(--font-display);margin:0 0 8px}
#about p,#about li{max-width:65ch;font-size:14px}
#about table{border-collapse:collapse;font-size:13.5px;margin:6px 0}
#about td,#about th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
#about td:last-child{font-variant-numeric:tabular-nums;text-align:right}
#about a{color:var(--water)}
.empty{padding:24px;color:var(--muted);text-align:center}
@media (max-width: 860px){
  .toolbar{display:grid;grid-template-columns:1fr 1fr auto}
  .search{grid-column:1 / -1}
  .toolbar select{min-width:0;width:100%}
  main{grid-template-columns:1fr;grid-template-rows:minmax(220px,44%) minmax(0,1fr)}
  #mapwrap{border-right:0;border-bottom:1px solid var(--line)}
  .brand small{display:none}
  .maplegend{display:none}
  #sheet{top:auto;height:86%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true">♨</span><h1 id="t-title">Onsen Finder</h1><small id="t-tag">Japan's hot springs · water quality · ratings</small></div>
  <button class="btn" id="aboutBtn" type="button" aria-haspopup="dialog">?</button>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" id="lang-ja" aria-pressed="false">日本語</button>
  </div>
</header>
<div class="toolbar">
  <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" autocomplete="off" placeholder="Search"></label>
  <select class="btn" id="regionSel" aria-label="Region"></select>
  <select class="btn" id="prefSel" aria-label="Prefecture"></select>
  <button class="btn primary" type="button" id="filterBtn"><span id="t-filters">Filters</span><span class="count" id="fcount" hidden>0</span></button>
</div>
<div class="chipsrow" id="typeChips" role="group" aria-label="Spring type"></div>
<main>
  <div id="mapwrap">
    <svg id="map" role="img" aria-label="Map of onsen in Japan"></svg>
    <div class="mapctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset" aria-label="Show all Japan">⤢</button>
    </div>
    <div class="maplegend" aria-hidden="true"><span id="t-legend">Yu-score</span><div class="bar"></div><div class="ticks"><span>3.0</span><span>3.5</span><span>4.0+</span></div></div>
  </div>
  <div id="listwrap">
    <div class="summary"><span id="summary"></span><span class="sumctl"><select class="btn sm" id="sortSel" aria-label="Sort"></select><button class="btn sm" type="button" id="resetBtn"></button></span></div>
    <div id="list" aria-live="polite"></div>
  </div>
</main>

<aside id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheetTitle">
  <div class="hd"><div><h2 id="sheetTitle"></h2><div class="alt" id="sheetAlt"></div></div><button class="x" type="button" id="sheetClose" aria-label="Close">×</button></div>
  <div class="bd" id="sheetBody"></div>
</aside>

<div id="filters" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="scrim" data-close="1"></div>
  <div class="pane">
    <div class="hd"><h2 id="fTitle"></h2><button class="x" type="button" data-close="1" aria-label="Close">×</button></div>
    <div class="bd" id="fBody"></div>
    <div class="ft"><button class="btn" type="button" id="fClear"></button><button class="btn primary" type="button" data-close="1" id="fDone"></button></div>
  </div>
</div>

<div id="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle"><div class="box" id="aboutBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  gScore:{en:'Minimum Yu-score', ja:'湯スコアの下限'},
  gData:{en:'Data', ja:'データ'},
  onlyK:{en:'Mostly free-flowing (源泉かけ流し)', ja:'源泉かけ流し中心のみ'},
  hideC:{en:'Hide mostly recirculated (循環ろ過)', ja:'循環ろ過中心を除く'},
  onlyCur:{en:'Only with water data', ja:'泉質データありのみ'},
  fromWiki:{en:"From the infobox of the Japanese Wikipedia article (日本語版ウィキペディア). Values vary by source; check the posted notice (掲示) at the bath.", ja:'日本語版ウィキペディアの記事情報（インフォボックス）より。源泉により異なるため、現地の掲示を確認してください。'},
  hideFac:{en:'Hide facilities & sights', ja:'施設・見どころを除く'},
  yu3:{en:'Yuchelin ★★★ 湯シュラン三ツ星', ja:'湯シュラン三ツ星'},
  h100:{en:'Top 20 · Nippon no Onsen 100', ja:'にっぽんの温泉100選 上位20'},
  jalan:{en:'Jalan 2026 ranking', ja:'じゃらん人気温泉地ランキング2026'},
  hoyou:{en:'National health spa 国民保養温泉地', ja:'国民保養温泉地'},
  sanmei:{en:"Japan's Three Famous Springs 日本三名泉", ja:'日本三名泉'},
  water:{en:'Water 泉質データ', ja:'泉質データ'},
  types:{en:'Spring types', ja:'泉質'},
  ph:{en:'pH', ja:'pH'},
  temp:{en:'Source temp.', ja:'源泉温度'},
  flow:{en:'Flow', ja:'湧出量'},
  color:{en:'Colour', ja:'色'},
  selfflow:{en:'Natural flow 自然湧出', ja:'自然湧出'},
  supply:{en:'Supply 給湯方式', ja:'給湯方式'},
  handling:{en:'Typical handling', ja:'よく見られる湯の扱い'},
  baths:{en:'Notable baths', ja:'代表的な浴場'},
  awards:{en:'Recognition', ja:'評価・認定'},
  scoreW:{en:'Water & freshness', ja:'湯・鮮度'},
  scoreR:{en:'Recognition bonus', ja:'評価ボーナス'},
  links:{en:'Look it up', ja:'調べる'},
  noWater:{en:'No detailed water analysis in this dataset yet. Check the 温泉分析書 and the 掲示 (posted notice) at the bath: by law it must say whether water is added (加水), heated (加温), recirculated (循環) or chlorinated (消毒).', ja:'このデータには詳しい泉質データがまだありません。浴場の温泉分析書と掲示（加水・加温・循環・消毒の有無は掲示が義務）を確認してください。'},
  typical:{en:'Area-level typical values; each inn and source differs. Always check the posted notice (掲示).', ja:'温泉地全体の代表値です。施設・源泉ごとに異なるため、現地の掲示を確認してください。'},
  approx:{en:'Map position is approximate.', ja:'地図上の位置は概略です。'},
  kind:{en:'Type', ja:'種別'},
  pref:{en:'Prefecture', ja:'都道府県'},
  about:{en:'About', ja:'このアプリについて'}
};
let LANG = store.get('lang','en');
const t = (k, ...a) => { const v = T[k][LANG]; return typeof v === 'function' ? v(...a) : v; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
const S = Object.assign({q:'', region:'', pref:'', types:[], supply:'', feats:[], rec:[], min:3.0, cur:false, hideFac:false, sort:'score'}, store.get('filters', {}));
S.q = ''; // never restore free text
let DATA = [], PREFS = {}, sel = null, shown = 150;

/* ---------- helpers ---------- */
function nameMain(o){ return LANG==='ja' ? o.ja : (o.en || o.ja); }
function nameAlt(o){ return LANG==='ja' ? (o.en || '') : o.ja; }
function prefName(id){ const p = PREFS[id]; if(!p) return ''; return LANG==='ja' ? p.ja : `${p.en} (${p.ja})`; }
function prefShort(id){ const p = PREFS[id]; if(!p) return ''; return LANG==='ja' ? p.ja : p.en; }
function typeLabel(k, short){ const ty = TYPES[k]; return LANG==='ja' ? ty.ja : (short ? ty.en : `${ty.en} (${ty.ja})`); }
function flagLabel(k){ const f = FLAGS[k]; if(!f) return k; return LANG==='ja' ? f.ja : `${f.en} (${f.ja})`; }
function scoreClass(s){ return s >= 3.5 ? '' : s >= 3.15 ? 'mid' : 'low'; }
function starsHTML(s){ const pct = Math.max(0, Math.min(100, (s/5)*100)); return `<span class="stars" aria-hidden="true"><i style="width:${pct}%"></i></span>`; }
const colorScale = d3.scaleLinear().domain([3.0,3.2,3.5,3.8,4.2]).range(['#8fa7ad','#5f9ea3','#d9a441','#c8442c','#8e1f12']).clamp(true);
function colorJa(c){ if(!c) return ''; if(LANG!=='ja') return c; return c.split(' / ').map(x => COLOR_JA[x] || x).join(' / '); }
function noteTr(n){ if(!n) return ''; return n.split('、').map(x => { x = x.trim(); return LANG==='ja' ? (NOTE_JA[x] || x) : (NOTE_EN[x] ? `${NOTE_EN[x]} (${x})` : x); }).join(LANG==='ja'?'、':', '); }

/* ---------- filtering ---------- */
function matches(o){
  if (S.region && PREFS[o.p] && PREFS[o.p].r !== S.region) return false;
  if (S.pref && String(o.p) !== String(S.pref)) return false;
  if (S.types.length && !S.types.some(k => o.ty.includes(k))) return false;
  if (S.supply === 'K' && !(o.cur && o.cur.sup === 'K')) return false;
  if (S.supply === 'noC' && o.cur && o.cur.sup === 'C') return false;
  if (S.feats.length && !S.feats.every(f => o.fl.includes(f))) return false;
  if (S.rec.length && !S.rec.every(r => r==='jalan' ? !!o.jalan : !!o[r])) return false;
  if (o.sc < S.min) return false;
  if (S.cur && !o.cur && !o.wk) return false;
  if (S.hideFac && o.k !== 'area') return false;
  if (S.q){
    const q = S.q.toLowerCase();
    const hay = (o.ja + ' ' + (o.en||'') + ' ' + (PREFS[o.p]?PREFS[o.p].ja+' '+PREFS[o.p].en:'')).toLowerCase();
    const plain = hay.normalize('NFD').replace(/[̀-ͯ]/g,'');
    if (!hay.includes(q) && !plain.includes(q.normalize('NFD').replace(/[̀-ͯ]/g,''))) return false;
  }
  return true;
}
function activeFilterCount(){
  return S.types.length + (S.supply?1:0) + S.feats.length + S.rec.length + (S.min>3?1:0) + (S.cur?1:0) + (S.hideFac?1:0);
}
function sorted(arr){
  const a = arr.slice();
  if (S.sort === 'north') a.sort((x,y)=> y.la - x.la);
  else if (S.sort === 'name') a.sort((x,y)=> LANG==='ja' ? x.ja.localeCompare(y.ja,'ja') : nameMain(x).localeCompare(nameMain(y),'en'));
  else a.sort((x,y)=> y.sc - x.sc || (y.cur?1:0)-(x.cur?1:0));
  return a;
}

/* ---------- map ---------- */
const svg = d3.select('#map');
const gRoot = svg.append('g');
const gLand = gRoot.append('g');
const gPts = gRoot.append('g');
let projection, path, zoom, curK = 1, landFeatures = [];
function sizeMap(){
  const el = document.getElementById('mapwrap');
  const w = el.clientWidth, h = el.clientHeight;
  svg.attr('viewBox', `0 0 ${w} ${h}`);
  const frame = {type:'MultiPoint', coordinates:[[128.6,30.9],[145.8,45.6],[129.5,45.4],[141.5,30.5]]};
  projection = d3.geoMercator().fitExtent([[10,10],[w-10,h-10]], frame);
  path = d3.geoPath(projection);
  gLand.selectAll('path').attr('d', path);
  gPts.selectAll('circle').attr('cx', o => projection([o.lo,o.la])[0]).attr('cy', o => projection([o.lo,o.la])[1]);
  zoom.extent([[0,0],[w,h]]).translateExtent([[-w, -h],[2*w, 2*h]]);
}
function drawLand(geo){
  landFeatures = geo.features;
  gLand.selectAll('path').data(landFeatures).join('path')
    .attr('class','pref').attr('d', path)
    .on('click', (ev, f) => { setPref(String(f.properties.id)); });
}
function ptRadius(o){ return (o.cur ? 4.4 : 2.9) * Math.pow(curK, -0.82); }
function ptStroke(o){ return ((sel && o.id === sel.id) ? 2.4 : 0.8) / curK; }
function drawPoints(list){
  const sorted = list.slice().sort((a,b)=> a.sc - b.sc); // high scores on top
  gPts.selectAll('circle').data(sorted, o => o.id).join(
    enter => enter.append('circle').attr('class','pt')
      .attr('cx', o => projection([o.lo,o.la])[0]).attr('cy', o => projection([o.lo,o.la])[1])
      .on('click', (ev, o) => { ev.stopPropagation(); openDetail(o, true); })
      .call(c => c.append('title')),
    update => update,
    exit => exit.remove()
  ).attr('r', ptRadius).attr('fill', o => colorScale(o.sc))
   .attr('stroke-width', ptStroke)
   .classed('sel', o => sel && o.id === sel.id)
   .order()
   .select('title').text(o => `${nameMain(o)} · ${o.sc.toFixed(2)}`);
  gLand.selectAll('path').classed('on', f => S.pref && String(f.properties.id) === String(S.pref));
}
function initZoom(){
  zoom = d3.zoom().scaleExtent([1, 60]).on('zoom', ev => {
    gRoot.attr('transform', ev.transform);
    if (Math.abs(ev.transform.k - curK) > 0.01){ curK = ev.transform.k; gPts.selectAll('circle').attr('r', ptRadius).attr('stroke-width', ptStroke); }
  });
  svg.call(zoom);
  document.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.8);
  document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.8);
  document.getElementById('zreset').onclick = () => zoomTo(null);
}
function zoomTo(feature, point){
  const el = document.getElementById('mapwrap'); const w = el.clientWidth, h = el.clientHeight;
  if (point){
    const [x,y] = projection([point.lo, point.la]);
    const k = Math.max(curK, 14);
    svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(w/2 - k*x, h/2 - k*y).scale(k));
    return;
  }
  if (!feature){ svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity); return; }
  const [[x0,y0],[x1,y1]] = path.bounds(feature);
  const k = Math.min(40, 0.85 / Math.max((x1-x0)/w, (y1-y0)/h));
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(w/2 - k*(x0+x1)/2, h/2 - k*(y0+y1)/2).scale(k));
}
function zoomToRegion(r){
  const feats = landFeatures.filter(f => PREFS[f.properties.id] && PREFS[f.properties.id].r === r);
  if (!feats.length) return zoomTo(null);
  zoomTo({type:'FeatureCollection', features: feats});
}

/* ---------- list ---------- */
function cardHTML(o){
  const tys = o.ty.filter(k=>TYPES[k]).slice(0,4).map(k => `<span class="tag t" style="background:${TYPES[k].c}">${esc(typeLabel(k,true))}</span>`).join('');
  const b = [];
  if (o.yu3) b.push(`<span class="badge">${LANG==='ja'?'湯シュラン★★★':'Yuchelin ★★★'}</span>`);
  if (o.h100) b.push(`<span class="badge">${LANG==='ja'?`100選 ${o.h100}位`:`100 Onsen #${o.h100}`}</span>`);
  if (o.cur && o.cur.sup==='K') b.push(`<span class="badge k">${LANG==='ja'?'かけ流し':'Free-flowing'}</span>`);
  if (o.hoyou) b.push(`<span class="badge k">${LANG==='ja'?'国民保養温泉地':'Health spa'}</span>`);
  return `<button type="button" class="card${sel&&sel.id===o.id?' sel':''}" data-id="${esc(o.id)}">
    <span class="score ${scoreClass(o.sc)}"><span class="n">${o.sc.toFixed(2)}</span>${starsHTML(o.sc)}</span>
    <span><h3>${esc(nameMain(o))}</h3>
    <span class="sub">${esc(nameAlt(o))}${nameAlt(o)?' · ':''}${esc(prefShort(o.p))}${o.k!=='area'?' · '+esc(KIND[o.k][LANG]):''}</span>
    <span class="tags">${tys}${b.join('')}</span></span></button>`;
}
let filtered = [];
function render(){
  filtered = sorted(DATA.filter(matches));
  document.getElementById('summary').innerHTML = t('showing', filtered.length, DATA.length);
  const list = document.getElementById('list');
  if (!filtered.length){ list.innerHTML = `<div class="empty">${t('none')}</div>`; }
  else {
    let html = filtered.slice(0, shown).map(cardHTML).join('');
    if (filtered.length > shown) html += `<button type="button" class="btn more" id="moreBtn">${t('more', Math.min(150, filtered.length - shown))}</button>`;
    list.innerHTML = html;
  }
  drawPoints(filtered);
  const fc = activeFilterCount(); const el = document.getElementById('fcount'); el.hidden = !fc; el.textContent = fc;
  store.set('filters', Object.assign({}, S, {q:''}));
}
document.getElementById('list').addEventListener('click', ev => {
  if (ev.target.closest('#moreBtn')){ shown += 150; render(); return; }
  const c = ev.target.closest('.card'); if (!c) return;
  const o = DATA.find(x => String(x.id) === c.dataset.id); if (o) openDetail(o, false);
});

/* ---------- detail ---------- */
function openDetail(o, fromMap){
  sel = o;
  document.getElementById('sheetTitle').textContent = nameMain(o);
  document.getElementById('sheetAlt').textContent = [nameAlt(o), prefName(o.p)].filter(Boolean).join(' · ');
  const c = o.cur;
  const parts = [];
  parts.push(`<div class="bigscore"><div><div class="n">${o.sc.toFixed(2)}</div>${starsHTML(o.sc)}</div>
    <div class="parts"><span>${t('scoreW')}</span><span>${o.sw.toFixed(2)}</span><span>${t('scoreR')}</span><span>+${o.sr.toFixed(2)}</span></div></div>`);
  const aw = [];
  if (o.yu3) aw.push(LANG==='ja' ? '湯シュラン 三ツ星（2026年10月認定・施設単位）' : 'Yuchelin 3-star 湯シュラン三ツ星 (Oct 2026, facility-level)');
  if (o.h100) aw.push(LANG==='ja' ? `第39回にっぽんの温泉100選 ${o.h100}位` : `Nippon no Onsen 100 (39th): #${o.h100}`);
  if (o.jalan){
    const JN = {revisit:['もう一度行ってみたい','Want to revisit'], dream:['あこがれ','Dream destination'], hidden:['おすすめしたい穴場','Hidden gem'], satisfaction:['満足度（総合）','Satisfaction'], hidden_sat:['満足度（秘湯）','Hidden-spa satisfaction']};
    for (const [k, r] of Object.entries(o.jalan)) aw.push(LANG==='ja' ? `じゃらん2026「${JN[k][0]}」${r}位` : `Jalan 2026 · ${JN[k][1]}: #${r}`);
  }
  if (o.sanmei) aw.push(LANG==='ja' ? '日本三名泉' : "One of Japan's Three Famous Springs (日本三名泉)");
  if (o.hoyou) aw.push(LANG==='ja' ? '国民保養温泉地（環境省指定）' : 'National health spa 国民保養温泉地 (Ministry of the Environment)');
  if (aw.length) parts.push(`<div class="sec"><h4>${t('awards')}</h4><div class="tags">${aw.map(a=>`<span class="badge">${esc(a)}</span>`).join('')}</div></div>`);
  if (c){
    parts.push(`<div class="sec"><p style="margin:0">${esc(LANG==='ja'?c.dja:c.den)}</p></div>`);
    parts.push(`<div class="sec"><h4>${t('supply')}</h4><div class="supply ${c.sup}">${esc(LANG==='ja'?SUPPLY[c.sup].ja:SUPPLY[c.sup].en+' ('+SUPPLY[c.sup].j2+')')}</div></div>`);
  }
  const rows = [];
  if (o.ty.length) rows.push([t('types'), o.ty.filter(k=>TYPES[k]).map(k=>`<span class="tag t" style="background:${TYPES[k].c}">${esc(typeLabel(k))}</span>`).join(' ')]);
  if (c){
    if (c.ph) rows.push([t('ph'), esc(c.ph)]);
    if (c.t) rows.push([t('temp'), esc(c.t)+' °C']);
    if (c.flow) rows.push([t('flow'), (LANG==='ja'?'毎分約':'~')+c.flow.toLocaleString()+(LANG==='ja'?'L':' L/min')]);
    if (c.color) rows.push([t('color'), esc(colorJa(c.color))]);
    if (c.self) rows.push([t('selfflow'), LANG==='ja'?'あり':'Yes']);
  }
  const w = !c && o.wk;
  if (w){
    if (w.ss) rows.push([LANG==='ja'?'泉質（記載）':'Listed type 泉質', esc(w.ss)]);
    if (w.ph) rows.push([t('ph'), esc(w.ph)]);
    if (w.t) rows.push([t('temp'), esc(w.t) + (/^[\d.\s\-〜~–]+$/.test(w.t) ? ' °C' : '')]);
    if (w.flow) rows.push([t('flow'), esc(w.flow)]);
    if (w.liq) rows.push([LANG==='ja'?'液性':'Acidity 液性', esc(w.liq)]);
    if (w.osm) rows.push([LANG==='ja'?'浸透圧':'Tonicity 浸透圧', esc(w.osm)]);
  }
  rows.push([t('kind'), esc(KIND[o.k][LANG])]);
  const wnote = c ? t('typical') : w ? t('fromWiki') : t('noWater');
  parts.push(`<div class="sec"><h4>${t('water')}</h4><dl class="kv">${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><p class="note">${wnote}</p></div>`);
  const fl = o.fl.filter(f => FLAGS[f] && f!=='approxloc');
  if (fl.length) parts.push(`<div class="sec"><h4>${t('handling')}</h4><div class="tags">${fl.map(f=>`<span class="tag">${esc(flagLabel(f))}</span>`).join('')}</div></div>`);
  if (o.fl.includes('approxloc')) parts.push(`<p class="note">${t('approx')}</p>`);
  if (c && c.baths && c.baths.length){
    parts.push(`<div class="sec"><h4>${t('baths')}</h4><ul class="baths">${c.baths.map(b => {
      const nm = LANG==='ja' ? b[0] : `${b[1]||b[0]} (${b[0]})`;
      return `<li>${esc(nm)}${b[2]?` <span class="note">— ${esc(noteTr(b[2]))}</span>`:''}</li>`; }).join('')}</ul></div>`);
  }
  const gm = `https://www.google.com/maps/search/?api=1&query=${o.la},${o.lo}`;
  const wq = encodeURIComponent(o.ja.replace(/（.*?）|\(.*?\)/g,''));
  const links = [`<a href="${gm}" target="_blank" rel="noopener">Google Maps</a>`,
    (o.wk && o.wk.title ? `<a href="https://ja.wikipedia.org/wiki/${encodeURIComponent(o.wk.title)}" target="_blank" rel="noopener">Wikipedia（日本語）</a>` : `<a href="https://ja.wikipedia.org/w/index.php?search=${wq}" target="_blank" rel="noopener">Wikipedia（日本語）</a>`),
    `<a href="https://onsen.nifty.com/search/?keyword=${wq}" target="_blank" rel="noopener">ニフティ温泉</a>`];
  if (typeof o.id === 'number') links.push(`<a href="https://www.wikidata.org/wiki/Q${o.id}" target="_blank" rel="noopener">Wikidata</a>`);
  if (o.yu3) links.push(`<a href="https://yuchelin.org/" target="_blank" rel="noopener">湯シュラン</a>`);
  parts.push(`<div class="sec"><h4>${t('links')}</h4><div class="links">${links.join('')}</div></div>`);
  document.getElementById('sheetBody').innerHTML = parts.join('');
  const sh = document.getElementById('sheet'); sh.classList.add('open'); sh.setAttribute('aria-hidden','false');
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('sel', el.dataset.id === String(o.id)));
  gPts.selectAll('circle').classed('sel', d => d.id === o.id).attr('stroke-width', ptStroke).filter(d => d.id === o.id).raise();
  if (!fromMap) zoomTo(null, o);
}
function closeDetail(){ const sh = document.getElementById('sheet'); sh.classList.remove('open'); sh.setAttribute('aria-hidden','true'); }
document.getElementById('sheetClose').onclick = closeDetail;
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeDetail(); closeFilters(); closeAbout(); } });

/* ---------- controls ---------- */
function fillSelects(){
  const rs = document.getElementById('regionSel');
  rs.innerHTML = `<option value="">${t('allRegions')}</option>` + REGIONS.map(r => `<option value="${r[0]}">${LANG==='ja'?r[1]:r[2]+' '+r[1]}</option>`).join('');
  rs.value = S.region;
  const ps = document.getElementById('prefSel');
  const plist = Object.values(PREFS).filter(p => !S.region || p.r === S.region).sort((a,b)=>a.id-b.id);
  ps.innerHTML = `<option value="">${t('allPrefs')}</option>` + plist.map(p => `<option value="${p.id}">${LANG==='ja'?p.ja:p.en+' '+p.ja}</option>`).join('');
  ps.value = S.pref;
  const ss = document.getElementById('sortSel');
  ss.innerHTML = `<option value="score">${t('sortScore')}</option><option value="north">${t('sortNorth')}</option><option value="name">${t('sortName')}</option>`;
  ss.value = S.sort;
}
function typeChips(){
  document.getElementById('typeChips').innerHTML = TYPE_ORDER.map(k => `<button type="button" class="chip" data-type="${k}" aria-pressed="${S.types.includes(k)}"><span class="sw" style="background:${TYPES[k].c}"></span>${esc(typeLabel(k))}</button>`).join('');
}
document.getElementById('typeChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.type; S.types = S.types.includes(k) ? S.types.filter(x=>x!==k) : S.types.concat(k);
  shown = 150; typeChips(); render(); buildFilters();
});
function setPref(id){
  S.pref = (S.pref === id) ? '' : id;
  if (S.pref && PREFS[S.pref]) S.region = PREFS[S.pref].r;
  shown = 150; fillSelects(); render();
  if (S.pref) zoomTo(landFeatures.find(f => String(f.properties.id) === S.pref)); else if (S.region) zoomToRegion(S.region); else zoomTo(null);
}
document.getElementById('regionSel').onchange = e => { S.region = e.target.value; S.pref = ''; shown = 150; fillSelects(); render(); S.region ? zoomToRegion(S.region) : zoomTo(null); };
document.getElementById('prefSel').onchange = e => { S.pref = ''; setPref(e.target.value); };
document.getElementById('sortSel').onchange = e => { S.sort = e.target.value; shown = 150; render(); };
let qt; document.getElementById('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(()=>{ S.q = e.target.value.trim(); shown = 150; render(); }, 120); });
document.getElementById('resetBtn').onclick = () => { Object.assign(S, {q:'', region:'', pref:'', types:[], supply:'', feats:[], rec:[], min:3.0, cur:false, hideFac:false}); document.getElementById('q').value=''; shown=150; fillSelects(); typeChips(); buildFilters(); render(); zoomTo(null); };

/* filter panel */
function chip(group, val, label, on){ return `<button type="button" class="chip" data-g="${group}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`; }
function buildFilters(){
  document.getElementById('fTitle').textContent = t('fTitle');
  document.getElementById('fClear').textContent = t('fClear');
  document.getElementById('fDone').textContent = t('fDone');
  const recs = ['yu3','h100','jalan','sanmei','hoyou'];
  document.getElementById('fBody').innerHTML = `
    <div class="fgroup"><h3>${t('gTypes')}</h3><div class="opts">${TYPE_ORDER.map(k=>chip('types',k,typeLabel(k),S.types.includes(k))).join('')}</div></div>
    <div class="fgroup"><h3>${t('gSupply')}</h3><div class="opts">${chip('supply','K',t('onlyK'),S.supply==='K')}${chip('supply','noC',t('hideC'),S.supply==='noC')}</div></div>
    <div class="fgroup"><h3>${t('gFeat')}</h3><div class="opts">${FEATURE_FILTERS.map(f=>chip('feats',f,flagLabel(f),S.feats.includes(f))).join('')}</div></div>
    <div class="fgroup"><h3>${t('gRec')}</h3><div class="opts">${recs.map(r=>chip('rec',r,t(r),S.rec.includes(r))).join('')}</div></div>
    <div class="fgroup"><h3><label for="minScore">${t('gScore')}</label></h3><div class="range"><input type="range" id="minScore" min="3" max="4.3" step="0.05" value="${S.min}"><output id="minOut">${S.min.toFixed(2)}</output></div></div>
    <div class="fgroup"><h3>${t('gData')}</h3><div class="opts">${chip('cur','1',t('onlyCur'),S.cur)}${chip('hideFac','1',t('hideFac'),S.hideFac)}</div></div>`;
  document.getElementById('minScore').oninput = e => { S.min = +e.target.value; document.getElementById('minOut').textContent = S.min.toFixed(2); shown=150; render(); };
}
document.getElementById('fBody').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const g = b.dataset.g, v = b.dataset.v;
  if (g === 'types' || g === 'feats' || g === 'rec'){ S[g] = S[g].includes(v) ? S[g].filter(x=>x!==v) : S[g].concat(v); }
  else if (g === 'supply'){ S.supply = S.supply === v ? '' : v; }
  else { S[g] = !S[g]; }
  shown = 150; buildFilters(); typeChips(); render();
});
function openFilters(){ buildFilters(); document.getElementById('filters').classList.add('open'); }
function closeFilters(){ document.getElementById('filters').classList.remove('open'); }
document.getElementById('filterBtn').onclick = openFilters;
document.getElementById('filters').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeFilters(); });
document.getElementById('fClear').onclick = () => { Object.assign(S, {types:[], supply:'', feats:[], rec:[], min:3.0, cur:false, hideFac:false}); shown=150; buildFilters(); typeChips(); render(); };

/* about */
function aboutHTML(){
  const en = LANG !== 'ja';
  return `<h2 id="aboutTitle">${en?'About the data and the Yu-score':'データと湯スコアについて'}</h2>
  ${en?`<p>The map lists <b>${DATA.length.toLocaleString()}</b> onsen areas, facilities and hot-spring sights in Japan that have coordinates on Wikidata, plus three Yuchelin 3-star facilities added by hand. Japan has about 2,900 onsen areas in total, so smaller places may be missing. <b>${DATA.filter(o=>o.cur).length}</b> major areas carry hand-compiled water data (spring types, pH, source temperature, flow, colour, how the water is supplied and typical handling), and <b>${DATA.filter(o=>!o.cur&&o.wk).length}</b> more show the water data from their Japanese Wikipedia infobox. These are area-level typical values: every inn and source differs. The data refreshes every week from Wikidata and Wikipedia.</p>`
  :`<p>Wikidataに座標がある全国の温泉地・施設・見どころ<b>${DATA.length.toLocaleString()}</b>件と、手作業で追加した湯シュラン三ツ星施設3件を掲載しています。全国の温泉地は約2,900あるため、小規模な温泉地は含まれていない場合があります。主要<b>${DATA.filter(o=>o.cur).length}</b>温泉地には泉質・pH・源泉温度・湧出量・色・給湯方式などをまとめ、さらに<b>${DATA.filter(o=>!o.cur&&o.wk).length}</b>か所は日本語版ウィキペディアの記事情報から泉質データを表示しています。いずれも温泉地全体の代表値です。データはWikidataとウィキペディアから毎週更新されます。</p>`}
  <p>${en?'<b>Yu-score 湯スコア</b> is a Tabelog-style 5-point score built by this app. Every onsen starts at 3.00. 3.50+ is excellent, 4.00+ is exceptional. It adds:':'<b>湯スコア</b>は食べログ風の5点満点スコアです。全温泉3.00から始まり、3.50以上は特に優れた湯、4.00以上は別格です。加点内容：'}</p>
  <table><tbody>
  <tr><td>${en?'Distinctive spring types (acidic, sulfur, CO₂, radon, iron, iodine)':'特徴的な泉質（酸性・硫黄・二酸化炭素・放射能・含鉄・含よう素）'}</td><td>≤ +0.10</td></tr>
  <tr><td>${en?'Mostly free-flowing 源泉かけ流し / mixed':'源泉かけ流し中心／混在'}</td><td>+0.30 / +0.12</td></tr>
  <tr><td>${en?'Natural flow 自然湧出':'自然湧出'}</td><td>+0.08</td></tr>
  <tr><td>${en?'Extreme pH, flow ≥ 5,000 L/min, bottom-fed bath, free-flowing declaration':'極端なpH・毎分5,000L以上・足元湧出・かけ流し宣言'}</td><td>≤ +0.16</td></tr>
  <tr><td>${en?'Water data from Wikipedia only: documented / extreme pH / flow ≥ 5,000 L/min':'ウィキペディアのみの泉質データ：記載あり／極端なpH／毎分5,000L以上'}</td><td>+0.03 / +0.05 / +0.05</td></tr>
  <tr><td>${en?'Yuchelin 湯シュラン 3-star (Oct 2026)':'湯シュラン三ツ星（2026年10月）'}</td><td>+0.35</td></tr>
  <tr><td>${en?'Nippon no Onsen 100, 39th (top 20)':'第39回にっぽんの温泉100選（上位20）'}</td><td>+0.06–0.25</td></tr>
  <tr><td>${en?'Jalan 2026 rankings (satisfaction, hidden gems, revisit, dream)':'じゃらん人気温泉地ランキング2026'}</td><td>≤ +0.18</td></tr>
  <tr><td>${en?"Japan's Three Famous Springs / national health spa":'日本三名泉／国民保養温泉地'}</td><td>+0.05 each</td></tr>
  </tbody></table>
  <p>${en?'The score rewards water quality and freshness first. Places without detailed data stay near 3.00 until they are documented, which says nothing bad about them. Yuchelin awards 1–3 stars to individual facilities; only the 21 three-star baths have been announced so far.':'湯の質と鮮度を最重視しています。詳しいデータがない温泉は3.00付近になりますが、評価が低いという意味ではありません。湯シュランは施設ごとに1〜3つ星を認定する制度で、現時点で発表済みは三ツ星21施設のみです。'}</p>
  <p>${en?'Since 2005 every bath in Japan must post whether its water is diluted 加水, heated 加温, recirculated 循環 or treated with additives/chlorine 入浴剤・消毒. "Free-flowing" 源泉かけ流し has no legal definition, so check that notice (掲示) on site.':'2005年以降、加水・加温・循環・入浴剤/消毒の有無の掲示が義務化されています。「源泉かけ流し」には法的定義がないため、現地の掲示を確認してください。'}</p>
  <h3>${en?'Sources':'出典'}</h3>
  <ul>
    <li><a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a> — ${en?'onsen items in Japan, coordinates, spring-type classes (CC0)':'日本の温泉項目・座標・泉質分類（CC0）'}</li>
    <li><a href="https://ja.wikipedia.org/wiki/Template:日本の温泉地" target="_blank" rel="noopener">日本語版ウィキペディア</a> — ${en?'泉質, 泉温, 湧出量, pH from onsen article infoboxes (CC BY-SA)':'温泉地記事のインフォボックス（泉質・泉温・湧出量・pH、CC BY-SA）'}</li>
    <li><a href="https://github.com/davepomerlo/onsen-finder" target="_blank" rel="noopener">GitHub: davepomerlo/onsen-finder</a> — ${en?'code, data and weekly update job':'コード・データ・毎週の更新処理'}</li>
    <li><a href="https://prtimes.jp/main/html/rd/p/000000005.000191740.html" target="_blank" rel="noopener">湯シュランアワード2026</a> — ${en?'21 three-star facilities, 26 Oct 2026':'三ツ星21施設（2026年10月26日）'}</li>
    <li><a href="https://www.nta.co.jp/media/tripa/articles/LNn72" target="_blank" rel="noopener">第39回 にっぽんの温泉100選</a> — ${en?'Kankō Keizai Shimbun, top 20':'観光経済新聞社・上位20'}</li>
    <li><a href="https://jrc.jalan.net/wp-content/uploads/2025/12/report_HotSpringResortRanking2026.pdf" target="_blank" rel="noopener">じゃらん人気温泉地ランキング2026</a> — ${en?'Jalan Research Center, Dec 2025':'じゃらんリサーチセンター（2025年12月）'}</li>
    <li><a href="https://www.env.go.jp/nature/onsen/area/index.html" target="_blank" rel="noopener">環境省 国民保養温泉地</a> — ${en?'79 designated national health spas':'79か所の指定地'}</li>
    <li><a href="https://github.com/dataofjapan/land" target="_blank" rel="noopener">dataofjapan/land</a> — ${en?'prefecture boundaries (GSI Global Map Japan)':'都道府県境界（地球地図日本）'}</li>
  </ul>
  <p class="note">${en?'Started November 2026. Water figures are representative values from public sources and may be out of date; confirm with each facility.':'2026年11月作成開始。泉質データは公開情報に基づく代表値で、変わっている場合があります。各施設で確認してください。'}</p>
  <p><button class="btn primary" type="button" id="aboutClose">${en?'Close':'閉じる'}</button></p>`;
}
function openAbout(){ const a = document.getElementById('about'); document.getElementById('aboutBox').innerHTML = aboutHTML(); a.classList.add('open'); document.getElementById('aboutClose').onclick = closeAbout; }
function closeAbout(){ document.getElementById('about').classList.remove('open'); }
document.getElementById('aboutBtn').onclick = openAbout;
document.getElementById('about').addEventListener('click', e => { if (e.target.id === 'about') closeAbout(); });

/* language */
function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById('lang-en').setAttribute('aria-pressed', LANG==='en');
  document.getElementById('lang-ja').setAttribute('aria-pressed', LANG==='ja');
  document.getElementById('t-title').textContent = t('title');
  document.getElementById('t-tag').textContent = t('tag');
  document.getElementById('t-filters').textContent = t('filters');
  document.getElementById('t-legend').textContent = t('legend');
  document.getElementById('q').placeholder = t('search');
  document.getElementById('resetBtn').textContent = t('reset');
  document.getElementById('aboutBtn').setAttribute('aria-label', t('about'));
  fillSelects(); typeChips(); buildFilters(); render();
  if (sel && document.getElementById('sheet').classList.contains('open')) openDetail(sel, true);
  if (document.getElementById('about').classList.contains('open')) openAbout();
}
document.getElementById('lang-en').onclick = () => { LANG='en'; store.set('lang', LANG); applyLang(); };
document.getElementById('lang-ja').onclick = () => { LANG='ja'; store.set('lang', LANG); applyLang(); };

/* ---------- boot ---------- */
initZoom();
Promise.all([fetch('onsen.json').then(r=>r.json()), fetch('prefs.json').then(r=>r.json()), fetch('japan.json').then(r=>r.json())])
.then(([onsen, prefs, geo]) => {
  DATA = onsen; prefs.forEach(p => PREFS[p.id] = p);
  sizeMap(); drawLand(geo); applyLang();
  if (S.pref) zoomTo(landFeatures.find(f => String(f.properties.id) === String(S.pref)));
  else if (S.region) zoomToRegion(S.region);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(()=>{ sizeMap(); drawPoints(filtered); }, 150); });
})
.catch(err => { document.getElementById('list').innerHTML = `<div class="empty">Could not load the onsen data (${esc(err.message)}). Reload the page to try again.</div>`; });
})();
</script>
</body>
</html>
